    --bg:#05070d; --text:#f2f4f8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:"Broadway","Abril Fatface","Playfair Display",Impact,serif;
    --nav:"Syne",var(--sans);
    --panel:rgba(14,18,30,.72); --line:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:var(--sans);overscroll-behavior:none;touch-action:none}
  a{color:inherit;text-decoration:none}

  /* Hero */
  #hero{position:fixed;inset:0;overflow:hidden}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
  body.ready #gl{opacity:1}
  .shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,7,13,.35),rgba(5,7,13,0) 30%,rgba(5,7,13,.15) 70%,rgba(5,7,13,.55))}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
  #title{padding:0 6%}
  #title span{font-weight:800;font-size:clamp(30px,7vw,96px);line-height:1;letter-spacing:-.02em;
    text-shadow:0 4px 30px rgba(0,0,0,.5);will-change:transform,filter,opacity}
  #tagline{padding:0 4%;opacity:0}
  #tagline .brand{font-family:var(--display);font-weight:400;font-size:clamp(64px,14vw,200px);line-height:1;
    text-transform:uppercase;letter-spacing:.04em;padding-left:.04em;text-shadow:0 2px 8px rgba(0,0,0,.55),0 6px 40px rgba(0,0,0,.6)}

  /* End-of-scroll background image (sits behind the ASTRA name) */
  #bgfill,#bg{position:absolute;inset:0;opacity:0;pointer-events:none;background-image:var(--city);background-position:center;background-repeat:no-repeat}
  #bgfill{background-size:cover;filter:blur(30px) saturate(1.15);transform:scale(1.2)}
  #bg{background-size:contain;will-change:transform,opacity}
  #fog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* Scroll hint: label + thin animated line */
  #hint{position:absolute;left:50%;bottom:clamp(20px,6vh,48px);transform:translateX(-50%);display:flex;flex-direction:column;
    align-items:center;gap:10px;color:rgba(240,244,248,.8);font:700 11px var(--nav);letter-spacing:.3em;
    transition:opacity .4s ease;pointer-events:none;opacity:0}
  body.ready #hint{opacity:1} body.ready #hint.gone{opacity:0}
  #hint i{display:block;width:1px;height:36px;background:linear-gradient(#fff,transparent);transform-origin:top;animation:drip 1.8s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(0)}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
  #bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.12)}
  #bar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;
    background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.95))}

  /* ───────── Navigation (matches reference layout) ───────── */
  .ui{opacity:0;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
  body.ready .ui{opacity:1;transform:none;transition-delay:.5s}
  #logo{position:absolute;top:22px;left:28px;z-index:5;display:flex;align-items:center;gap:8px;transform:translateY(-16px)}
  #logo span{font:800 15px var(--nav);letter-spacing:.3em}

  #nav{position:absolute;top:clamp(14px,3vh,26px);left:50%;z-index:5;width:min(920px,64vw);height:56px;
    margin-left:calc(min(920px,64vw)/-2);transform:translateY(-24px)}
  #nav::before,#nav::after{content:"";position:absolute}
  #nav::before{inset:0;background:linear-gradient(#d9dde5,#8b93a2);clip-path:polygon(0 0,100% 0,calc(100% - 46px) 100%,46px 100%)}
  #nav::after{inset:2px;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    clip-path:polygon(0 0,100% 0,calc(100% - 45px) 100%,45px 100%)}
  #nav .notch{position:absolute;left:46px;right:46px;bottom:0;height:3px;z-index:2;
    background:linear-gradient(90deg,#d9dde5 0 70%,transparent 70%) 0 0/84px 100% repeat-x}
  #nav ul{list-style:none;position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:space-around;padding:0 56px}
  #nav li{position:relative}
  #nav a{font:700 13px var(--nav);letter-spacing:.14em;text-transform:uppercase;padding:8px 4px;position:relative;white-space:nowrap}
  #nav a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:#fff;box-shadow:0 0 10px #9fb4ff;transition:right .3s ease}
  #nav a:hover::after{right:0}
  #nav .tag{position:absolute;top:-6px;left:0;font:800 8px var(--nav);letter-spacing:.12em;color:#ffd21f}

  #signin{position:absolute;top:clamp(16px,3.4vh,30px);right:28px;z-index:5;display:flex;align-items:center;gap:10px;
    padding:12px 20px;border-radius:8px;background:rgba(40,52,76,.85);border:1px solid var(--line);
    font:700 12px var(--nav);letter-spacing:.14em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transform:translateY(-16px);transition-property:opacity,transform,background}
  #signin svg.i{width:20px;height:20px}
  #signin:hover{background:rgba(70,88,124,.9)}

  .side{position:absolute;top:50%;z-index:5;display:flex;flex-direction:column;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  #left{left:20px;width:76px;padding:6px 0;transform:translate(-30px,-50%)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const VIDEO_SRC = "https://cdn.21st.dev/assets/mirror/21/21a77eac28eacbb7e142016eefeaa0b4a766619e51113629a3bc6df6af066c0f.mp4";
  const SCRUB_DISTANCE = 3200, MIN_LOAD_MS = 2600, MAX_LOAD_MS = 14000;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const video = document.createElement("video");
  video.crossOrigin = "anonymous"; video.muted = true; video.playsInline = true; video.preload = "auto"; video.src = VIDEO_SRC;
  const kick = video.play();
  if (kick && kick.then) kick.then(() => video.pause()).catch(() => {}); else video.pause();

  const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x05070d, 1);
  renderer.autoClear = false;

  const bgScene = new THREE.Scene();
  const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
  const texture = new THREE.VideoTexture(video);
  texture.minFilter = texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: texture }));
  bgScene.add(plane);

  const starScene = new THREE.Scene();
  const starCam = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
  const pos = new Float32Array(2100);
  for (let i = 0; i < 700; i++) {
    pos[i*3] = (Math.random() - .5) * 40; pos[i*3+1] = (Math.random() - .5) * 24; pos[i*3+2] = -Math.random() * 60;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(geo, new THREE.PointsMaterial({
    size: .09, color: 0xcfd9ff, transparent: true, opacity: .55, depthWrite: false, blending: THREE.AdditiveBlending }));
  starScene.add(stars);

  function fitCover() {
    const sa = innerWidth / innerHeight, va = video.videoWidth ? video.videoWidth / video.videoHeight : 16 / 9;
    texture.repeat.set(1, 1); texture.offset.set(0, 0);
    if (sa > va) { texture.repeat.y = va / sa; texture.offset.y = (1 - texture.repeat.y) / 2; }
    else { texture.repeat.x = sa / va; texture.offset.x = (1 - texture.repeat.x) / 2; }
  }
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    starCam.aspect = innerWidth / innerHeight; starCam.updateProjectionMatrix(); fitCover();
  }
  addEventListener("resize", resize); resize();

  // Loading
  const loadFill = $("loadFill"), pct = $("pct"), t0 = performance.now();
  let duration = 0, buffered = 0, shown = 0, loaded = false, ready = false;
  function updateBuffered() {
    if (!video.duration) return;
    duration = video.duration;
    const b = video.buffered;
    if (b.length) buffered = clamp(b.end(b.length - 1) / duration, 0, 1);
  }
  video.addEventListener("progress", updateBuffered);
  video.addEventListener("loadedmetadata", () => { updateBuffered(); fitCover(); });
  video.addEventListener("loadeddata", () => { updateBuffered(); fitCover(); });
  video.addEventListener("canplaythrough", () => { buffered = 1; });

  function loadTick() {
    const el = performance.now() - t0;
    let tgt = Math.min(buffered, clamp(el / MIN_LOAD_MS, 0, 1));
    if (el > MAX_LOAD_MS) tgt = 1;
    shown += (tgt - shown) * .08;
    if (tgt === 1 && shown > .995) shown = 1;
    loadFill.style.transform = `scaleX(${shown})`;
    pct.textContent = Math.round(shown * 100) + "%";
    if (shown >= 1 && !loaded) { loaded = true; finish(); return; }
    requestAnimationFrame(loadTick);
  }
  requestAnimationFrame(loadTick);
  function finish() {
    if (!duration) duration = video.duration || 0;
    if (reduceMotion && duration) video.currentTime = duration * .92;
    setTimeout(() => {
      document.body.classList.add("ready"); ready = true;
      setTimeout(() => document.body.classList.add("gone"), 1400);
    }, 350);
  }

  // Scroll-scrub (page locked)
  let target = 0, current = 0, started = false, seeking = false, pending = null, touchY = 0;
  video.addEventListener("seeked", () => {
    seeking = false;
    if (pending !== null) { const t = pending; pending = null; seeking = true; video.currentTime = t; }
  });
  const seekTo = (t) => { if (seeking) { pending = t; return; } seeking = true; video.currentTime = t; };
  const addDelta = (dy) => { if (!ready) return; target = clamp(target + dy / SCRUB_DISTANCE, 0, 1); if (target > .001) started = true; };
  addEventListener("wheel", (e) => { addDelta(e.deltaY); e.preventDefault(); }, { passive: false });
  addEventListener("touchstart", (e) => { touchY = e.touches[0]?.clientY ?? 0; }, { passive: true });
  addEventListener("touchmove", (e) => { const y = e.touches[0]?.clientY ?? touchY; addDelta(touchY - y); touchY = y; e.preventDefault(); }, { passive: false });
  addEventListener("keydown", (e) => {
    const s = { ArrowDown: 120, PageDown: 600, " ": 600, ArrowUp: -120, PageUp: -600 }[e.key];
    if (s) { addDelta(s); e.preventDefault(); }
  });

  const bgEl = $("bg"), bgfillEl = $("bgfill"), titleEl = document.querySelector("#title span"), taglineEl = $("tagline"), hintEl = $("hint"), barFill = $("barFill");
  function frame() {
    current += (target - current) * .18;
    if (duration > 0 && !reduceMotion) seekTo(current * duration);
    const s = 1 + current * .06; plane.scale.set(s, s, 1);
    stars.position.z = current * 40; stars.rotation.z = current * .08;

    // end of scroll: city image fades in behind the ASTRA name
    const cc = clamp((current - .72) / .2, 0, 1), ce = cc * cc * (3 - 2 * cc);
    bgEl.style.opacity = bgfillEl.style.opacity = ce;
    bgEl.style.transform = `scale(${1.08 - .08 * ce})`;

    // fog: rolls in as the metro door opens (.42→.72), holds while the city image arrives, then lifts
    const fi = clamp((current - .42) / .3, 0, 1), fo = clamp((current - .88) / .12, 0, 1);
    window.__fogD = (fi * fi * (3 - 2 * fi)) * (1 - .92 * fo * fo * (3 - 2 * fo));

    const t = 1 - clamp(current / .35, 0, 1);
    titleEl.style.opacity = t;
    titleEl.style.transform = `translateY(${(1 - t) * -24}px) scale(${.96 + t * .04})`;
    titleEl.style.filter = `blur(${(1 - t) * 10}px)`;

    const k = clamp((current - .82) / .18, 0, 1);
    taglineEl.style.opacity = k;
    taglineEl.style.transform = `translateY(${(1 - k) * 20}px) scale(${.97 + k * .03})`;
    taglineEl.style.filter = `blur(${(1 - k) * 8}px)`;

    hintEl.classList.toggle("gone", started);
    barFill.style.transform = `scaleX(${current})`;

    renderer.clear(); renderer.render(bgScene, bgCam);
    renderer.clearDepth(); renderer.render(starScene, starCam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
/* Fog + fire intro (runs only while the loader is visible) */
(() => {
  const c = document.getElementById("fx"), ctx = c.getContext("2d");
  let W, H, dpr;
  const size = () => { dpr = Math.min(devicePixelRatio, 2); W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; };
  size(); addEventListener("resize", size);
  const fog = Array.from({ length: 9 }, (_, i) => ({
    x: Math.random(), y: .5 + Math.random() * .55, r: .3 + Math.random() * .35,
    s: (Math.random() * .5 + .15) * (i % 2 ? 1 : -1), p: Math.random() * 6.28 }));
  const parts = [];
  let t = 0, burst = 0;
  function spawn() {
    parts.push({ x: Math.random() * W, y: H + 12 * dpr, vx: (Math.random() - .5) * .6 * dpr,
      vy: -(1.2 + Math.random() * 2.8) * dpr, life: 0, max: 80 + Math.random() * 110,
      r: (8 + Math.random() * 20) * dpr, ember: Math.random() < .25 });
  }
  function draw() {
    if (document.body.classList.contains("gone")) return;
    t += .016;
    burst += ((document.body.classList.contains("ready") ? 1 : 0) - burst) * .06;
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, W, H);

    // drifting fog
    for (const f of fog) {
      const x = (f.x + Math.sin(t * .15 * f.s + f.p) * .15) * W;
      const y = (f.y + Math.cos(t * .2 + f.p) * .05 - burst * .25) * H;
      const r = f.r * Math.max(W, H) * (1 + burst * .4);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,120,50,${.10 + .05 * Math.sin(t + f.p)})`);
      g.addColorStop(.5, "rgba(90,40,50,.07)");
      g.addColorStop(1, "rgba(5,7,13,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    // fire + embers rising from the bottom
    ctx.globalCompositeOperation = "lighter";
    const hg = ctx.createLinearGradient(0, H, 0, H * .55);
    hg.addColorStop(0, `rgba(255,90,30,${.28 + burst * .25})`); hg.addColorStop(1, "rgba(255,90,30,0)");
    ctx.fillStyle = hg; ctx.fillRect(0, H * .55, W, H * .45);

    if (parts.length < 900) for (let i = 0, n = 4 + burst * 12; i < n; i++) spawn();
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], k = ++p.life / p.max;
      if (k >= 1) { parts.splice(i, 1); continue; }
      p.x += p.vx + Math.sin(t * 3 + p.y * .01) * .8 * dpr; p.y += p.vy; p.vy *= .995;
      const r = p.ember ? p.r * .18 : p.r * (1 - k * .8), a = (1 - k) * (p.ember ? .9 : .22);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, k < .35 ? `rgba(255,220,140,${a})` : `rgba(255,120,40,${a})`);
      g.addColorStop(1, "rgba(120,20,10,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
<script>
/* Fog everywhere — driven by window.__fogD (0..1) from the scroll loop */
(() => {
  const c = document.getElementById("fog"), ctx = c.getContext("2d");
  let W, H;
  const size = () => { const d = Math.min(devicePixelRatio, 1.5); W = c.width = innerWidth * d; H = c.height = innerHeight * d; };
  size(); addEventListener("resize", size);
  const spr = document.createElement("canvas"); spr.width = spr.height = 256;
  const sx = spr.getContext("2d"), g = sx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, "rgba(244,196,190,.9)"); g.addColorStop(.5, "rgba(238,184,180,.45)"); g.addColorStop(1, "rgba(238,184,180,0)");
  sx.fillStyle = g; sx.fillRect(0, 0, 256, 256);
  const puffs = Array.from({ length: 34 }, () => ({
    x: Math.random(), y: Math.random(), r: .22 + Math.random() * .4,
    v: (Math.random() * .012 + .003) * (Math.random() < .5 ? -1 : 1), p: Math.random() * 6.28, a: .5 + Math.random() * .5 }));
  let t = 0, cleared = false;
  (function draw() {
    requestAnimationFrame(draw);
    const d = window.__fogD || 0;
    if (d < .004) { if (!cleared) { ctx.clearRect(0, 0, W, H); cleared = true; } return; }
    cleared = false; t += .016;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = d * .5; ctx.fillStyle = "rgb(216, 201, 200)"; ctx.fillRect(0, 0, W, H);
    const m = Math.max(W, H);
    for (const f of puffs) {
      f.x += f.v * .016; if (f.x > 1.3) f.x = -.3; if (f.x < -.3) f.x = 1.3;
      const r = f.r * m * (.8 + .4 * d), x = f.x * W, y = (f.y + Math.sin(t * .3 + f.p) * .03) * H;
      ctx.globalAlpha = Math.min(1, d * f.a * 1.15);
      ctx.drawImage(spr, x - r, y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  })();
})();
</script>
