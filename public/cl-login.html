<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contigent leader sign in — ASTRA FEST 2026</title><link rel="stylesheet" href="/css/app.css"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/favicon-180.png"></head><body>
<nav aria-label="Main"><a class="logo" href="/" aria-label="ASTRA FEST 2026 home"><img src="/Image/astra-logo.png" alt="" style="height:58px;width:auto;display:block"></a><div class="links"><a class="l" href="/">Home</a><a class="l" href="/event.html">Events</a><a class="l" href="/register.html">Register</a><a class="l" href="/cl-login.html">Contigent leader</a></div></nav>
<header class="top"><h1>Contigent leader SIGN IN</h1><p>Manage your college's registrations</p></header>
<main class="panel narrow" id="main">

<div id="msg"></div>
<form id="f"><label>Email<input name="email" type="email" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<p><button class="btn pri" id="go" type="submit">Sign in</button> <a class="btn sec" href="/cl-register.html">Register your college</a></p></form>
</main>
<script src="/js/api.js"></script>
<script>

api("/api/cl/me").then(() => location.replace("/cl-dashboard.html")).catch(() => {});
$("#f").onsubmit = async (e) => {
  e.preventDefault(); const m = $("#msg"), b = $("#go"); b.disabled = true; showMsg(m, "");
  try { await api("/api/cl/login", { method: "POST", body: Object.fromEntries(new FormData(e.target)) }); location.href = "/cl-dashboard.html"; }
  catch (err) { showMsg(m, err.message); b.disabled = false; }
};
</script></body></html>
